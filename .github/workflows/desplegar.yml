# Cada push a main despliega a la VM de GCP (dent-view-asygnuz). Sin claves: Workload Identity Federation,
# restringida a este repo y a la rama main. Los secretos de producción viven solo en la VM (infra/.env).
name: Desplegar a GCP

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: desplegar
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PROYECTO: dent-view-asygnuz
  ZONA: us-east1-b
  VM: dent-view
  URL: https://dentview.asygnuz.com

jobs:
  # Compuerta previa: tipos y pruebas unitarias sin base de datos (las pruebas que la necesitan se omiten solas sin DATABASE_URL).
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Generar el cliente de Prisma
        working-directory: packages/db
        env:
          DATABASE_URL: postgresql://x:x@localhost:5432/x # relleno: generate no se conecta
        run: npx prisma generate

      - name: Tipos
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Pruebas unitarias
        working-directory: apps/web
        env:
          BETTER_AUTH_SECRET: prueba-ci-no-es-un-secreto-real-0123456789
        run: npx vitest run

  desplegar:
    needs: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Parchar el visor OHIF
        run: bash viewer/scripts/aplicar-parches.sh

      - name: Empaquetar
        run: |
          tar --exclude=.git --exclude=.github --exclude=node_modules --exclude=.next \
              --exclude=infra/.env --exclude=infra/Caddyfile.produccion --exclude='docs/qa' \
              -czf "$RUNNER_TEMP/app.tgz" .

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/187757273619/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: github-deploy@dent-view-asygnuz.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Subir a la VM
        run: |
          gcloud compute scp "$RUNNER_TEMP/app.tgz" "$VM:/tmp/app.tgz" \
            --project="$PROYECTO" --zone="$ZONA" --quiet

      # La app nueva se extrae en un directorio aparte y reemplaza a la vigente con dos mv: nunca quedan archivos viejos mezclados con los nuevos.
      # infra/.env (secretos) e infra/Caddyfile.produccion viven solo en la VM y se copian al directorio nuevo. Los volúmenes de Docker
      # no dependen del nombre del directorio (compose.yaml fija `name: dent-view`).
      - name: Construir y levantar
        run: |
          cat > "$RUNNER_TEMP/desplegar.sh" <<'REMOTO'
          set -euo pipefail
          # Versión desplegada (se muestra en la app y en /api/version): $1 versión, $2 commit corto, $3 fecha UTC.
          [[ "${1:-}" =~ ^[0-9A-Za-z._-]{1,40}$ && "${2:-}" =~ ^[0-9a-f]{7,40}$ && "${3:-}" =~ ^[0-9TZ:.-]{10,30}$ ]] || { echo "argumentos de versión inválidos"; exit 1; }
          VIGENTE=/opt/dent-view
          NUEVO=/opt/dent-view.nuevo
          ANTERIOR=/opt/dent-view.anterior
          sudo rm -rf "$NUEVO" "$ANTERIOR"
          sudo mkdir -p "$NUEVO"
          sudo tar xzf /tmp/app.tgz -C "$NUEVO" --warning=no-unknown-keyword
          sudo rm -f /tmp/app.tgz
          sudo cp -p "$VIGENTE/infra/.env" "$NUEVO/infra/.env"
          sudo cp -p "$VIGENTE/infra/Caddyfile.produccion" "$NUEVO/infra/Caddyfile.produccion"
          sudo chown --reference="$VIGENTE" "$NUEVO"
          for kv in "APP_VERSION=$1" "APP_SHA=$2" "APP_BUILT_AT=$3"; do
            sudo sed -i "/^${kv%%=*}=/d" "$NUEVO/infra/.env"; echo "$kv" | sudo tee -a "$NUEVO/infra/.env" >/dev/null
          done
          # El worker dispara los procesos programados (notificaciones, CRM) con este secreto; se crea una sola vez y se conserva el existente.
          sudo grep -q '^CRON_SECRET=' "$NUEVO/infra/.env" || echo "CRON_SECRET=$(openssl rand -hex 24)" | sudo tee -a "$NUEVO/infra/.env" >/dev/null
          sudo mv "$VIGENTE" "$ANTERIOR"
          sudo mv "$NUEVO" "$VIGENTE"
          cd "$VIGENTE/infra"
          sudo docker compose -f compose.yaml -f compose.produccion.yaml up -d --build --remove-orphans
          # Caddy y el visor montan archivos del directorio: se recrean para que tomen los nuevos (el mv deja montado el inodo viejo).
          sudo docker compose -f compose.yaml -f compose.produccion.yaml up -d --force-recreate --no-deps caddy visor
          sudo docker image prune -f >/dev/null
          # Éxito: se descarta la versión anterior (si algo falló arriba, queda en $ANTERIOR para recuperarla a mano).
          sudo rm -rf "$ANTERIOR"
          REMOTO
          gcloud compute scp "$RUNNER_TEMP/desplegar.sh" "$VM:/tmp/desplegar.sh" --project="$PROYECTO" --zone="$ZONA" --quiet
          APP_SHA="${GITHUB_SHA:0:7}"
          APP_VERSION="$(date -u +%Y.%m.%d)-r${GITHUB_RUN_NUMBER}"
          APP_BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Desplegando versión $APP_VERSION ($APP_SHA)"
          gcloud compute ssh "$VM" --project="$PROYECTO" --zone="$ZONA" --quiet --command "bash /tmp/desplegar.sh '$APP_VERSION' '$APP_SHA' '$APP_BUILT_AT'; r=\$?; rm -f /tmp/desplegar.sh; exit \$r"

      - name: Verificar
        run: |
          ESPERADO="${GITHUB_SHA:0:7}"
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/ingresar" || true)
            ver=$(curl -s --max-time 10 "$URL/api/version" || true)
            sha=$(printf '%s' "$ver" | sed -n 's/.*"sha":"\([0-9a-f]*\)".*/\1/p')
            echo "intento $i: /ingresar=$code, version servida=${sha:-?} (esperada $ESPERADO)"
            if [ "$code" = "200" ] && [ "$sha" = "$ESPERADO" ]; then echo "OK: producción sirve $ver"; exit 0; fi
            sleep 10
          done
          echo "El sitio no sirve la versión esperada ($ESPERADO): el despliegue no se reflejó"; exit 1
